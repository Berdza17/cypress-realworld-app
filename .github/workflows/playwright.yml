name: Playwright Tests

on:
  push:
    branches: [ main, develop, cypress-to-playwright, add-github-actions ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'yarn'
    
    - name: Install dependencies
      run: yarn install --frozen-lockfile
    
    - name: Install Playwright dependencies
      run: |
        cd playwright
        yarn install --frozen-lockfile
    
    - name: Install Playwright Browsers
      run: |
        cd playwright
        npx playwright install --with-deps
    
    - name: Start application
      run: |
        yarn dev &
        sleep 30
      env:
        NODE_ENV: test
    
    - name: Wait for application to be ready
      run: |
        npx wait-on http://localhost:3000 http://localhost:3001 --timeout 60000
    
    - name: Run Playwright tests
      run: |
        cd playwright
        yarn test
      env:
        CI: true
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright/playwright-report/
        retention-days: 30

  test-ui-only:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'yarn'
    
    - name: Install dependencies
      run: yarn install --frozen-lockfile
    
    - name: Install Playwright dependencies
      run: |
        cd playwright
        yarn install --frozen-lockfile
    
    - name: Install Playwright Browsers
      run: |
        cd playwright
        npx playwright install --with-deps
    
    - name: Start application
      run: |
        yarn dev &
        sleep 30
      env:
        NODE_ENV: test
    
    - name: Wait for application to be ready
      run: |
        npx wait-on http://localhost:3000 http://localhost:3001 --timeout 60000
    
    - name: Run UI tests only
      run: |
        cd playwright
        yarn test:ui
      env:
        CI: true

  test-api-only:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'yarn'
    
    - name: Install dependencies
      run: yarn install --frozen-lockfile
    
    - name: Install Playwright dependencies
      run: |
        cd playwright
        yarn install --frozen-lockfile
    
    - name: Install Playwright Browsers
      run: |
        cd playwright
        npx playwright install --with-deps
    
    - name: Start application
      run: |
        yarn dev &
        sleep 30
      env:
        NODE_ENV: test
    
    - name: Wait for application to be ready
      run: |
        npx wait-on http://localhost:3000 http://localhost:3001 --timeout 60000
    
    - name: Run API tests only
      run: |
        cd playwright
        yarn test:api
      env:
        CI: true
